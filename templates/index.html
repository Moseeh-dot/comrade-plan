<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comrade Plan - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#eab308">
</head>

<body>
    <div class="container">
        <header>
            <h1 style="color: var(--accent-green);">Comrade Plan</h1>
            <p style="color: var(--text-muted);">Master Your Campus Allowance</p>
        </header>

        <div class="form-card">
            <h2 style="text-align: center; margin-bottom: 20px;">Login</h2>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="warning" style="margin-bottom: 15px;">
                {{ messages[0] }}
            </div>
            {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <label style="font-size: 0.9rem; color: var(--text-muted);">Email Address</label>
                <input type="email" name="email" placeholder="e.g. mose@campus.ac.ke" required>

                <label style="font-size: 0.9rem; color: var(--text-muted);">Password</label>
                <input type="password" name="password" placeholder="••••••••" required>

                <button type="submit">Access My Vault</button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                <p>New Comrade? <a href="/register"
                        style="color: var(--accent-blue); text-decoration: none; font-weight: bold;">Create Account</a>
                </p>
                 <a href="{{ url_for('forgot_password') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.8rem;">
    Forgot Password?
                 </a>
                
            </div>
        </div>

        <footer style="text-align: center; margin-top: 40px; color: var(--text-muted); font-size: 0.8rem;">
            <p>&copy; 2026 Comrade Plan - Built for Financial Discipline</p>
        </footer>
    </div>
</body>

</html>
