<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Comrade Plan KE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="container">
        <div class="form-card">
            <h2>🔒 Reset Access</h2>
            <p>Enter your email and we will send you a secure link to reset your password.</p>
            
            <form action="{{ url_for('forgot_password') }}" method="POST">
                <div class="input-group">
                    <label>University Email</label>
                    <input type="email" name="email" placeholder="gitaumoses.munene@gmail.com" required>
                </div>
                <button type="submit" class="btn-primary">Send Reset Link</button>
            </form>
            
            <div class="footer-links">
                <a href="{{ url_for('index') }}">← Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
